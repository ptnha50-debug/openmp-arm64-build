name: Build open.mp ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout open.mp
        uses: actions/checkout@v4
        with:
          repository: openmultiplayer/open.mp
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build python3-pip python3-venv git pkg-config
          python3 -m pip install --break-system-packages conan

      - name: Configure Conan
        run: conan profile detect --force

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTARGET_BUILD_ARCH=armv8

      - name: Build
        run: cmake --build build --parallel 4

      - name: Find server
        run: find build -type f -name "omp-server" -print

      - name: Package
        run: |
          mkdir -p artifact
          cp "$(find build -type f -name 'omp-server' | head -n 1)" artifact/omp-server
          chmod +x artifact/omp-server
          file artifact/omp-server

      - name: Upload ARM64 server
        uses: actions/upload-artifact@v4
        with:
          name: openmp-linux-arm64
          path: artifact/omp-server
